{% extends "base.html" %}
{% block title %}{{ status }} · Market Headlines{% endblock %}
{% block content %}
<section class="error-card" data-testid="error">
  <div class="error-code">{{ status }}</div>
  <h1>{% if status == 404 %}Symbol not found{% elif status == 400 %}Invalid symbol{% else %}Something went wrong{% endif %}</h1>
  <p>{{ message }}</p>
  <p><a class="button" href="/">Back to the latest news</a></p>
</section>
{% endblock %}
