<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Market Headlines{% endblock %}</title>
  <meta name="color-scheme" content="light dark">
  <script data-testid="theme-init">
    // Pick the theme before the first paint so there is no flash: a saved choice wins, otherwise follow the system.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset_url(request, 'style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Market Headlines home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><polyline points="3,17 9,11 13,15 21,7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">Market<span>Headlines</span></span>
      </a>
      <form class="search" action="/search" method="get" role="search">
        <label for="symbol" class="visually-hidden">Ticker symbol</label>
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="symbol" name="symbol" type="text" placeholder="Search a ticker or company, e.g. AAPL or Apple" autocomplete="off" required maxlength="40"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggestions" data-testid="search-input">
        <ul class="suggestions" id="search-suggestions" role="listbox" aria-label="Suggestions" data-testid="suggestions" hidden></ul>
        <button type="submit">Look up</button>
      </form>
      <button type="button" class="theme-toggle" id="theme-toggle" data-testid="theme-toggle"
              aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <nav class="tabs" aria-label="Sections" data-testid="tabs">
      <div class="tabs-inner">
        <a class="tab{% if active_tab == 'financial' %} active{% endif %}" href="/" data-testid="tab" data-tab="financial"{% if active_tab == 'financial' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><polyline points="3,17 9,11 13,15 21,7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Financial<span class="tab-extra"> news</span></span>
        </a>
        {% for t in topics %}
        <a class="tab{% if active_tab == t.slug %} active{% endif %}" href="/news/{{ t.slug }}" data-testid="tab" data-tab="{{ t.slug }}"{% if active_tab == t.slug %} aria-current="page"{% endif %}>
          {% if t.slug == 'technology' %}
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          {% elif t.slug == 'health' %}
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          {% endif %}
          <span>{{ t.title }}<span class="tab-extra"> news</span></span>
        </a>
        {% endfor %}
        <a class="tab{% if active_tab == 'portfolio' %} active{% endif %}" href="/portfolio" data-testid="tab" data-tab="portfolio"{% if active_tab == 'portfolio' %} aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <span>My Portfolio</span>
        </a>
      </div>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">Headlines link to their original publishers. Quotes may be delayed.</footer>
  <script src="{{ asset_url(request, 'app.js') }}" defer></script>
</body>
</html>
