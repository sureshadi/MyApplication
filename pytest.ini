[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: browser tests that start a live server (run with: pytest -m e2e)
addopts = -m "not e2e"
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx`
