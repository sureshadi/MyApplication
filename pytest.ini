[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    e2e: browser tests that start a live server (run with: pytest -m e2e)
    remote_safe: browser tests that may also run against a deployed site (BASE_URL)
    local_only: browser tests that check the local server's mocked data exactly (skipped with BASE_URL)
addopts = -m "not e2e"
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx`
