name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-api:
    name: Unit and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --junitxml=test-results/unit-api.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-api-results
          path: test-results/

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: unit-and-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e -v --junitxml=test-results/e2e.xml --screenshot only-on-failure --output test-results/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/
