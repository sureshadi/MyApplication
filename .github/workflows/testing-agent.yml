name: Testing agent

# On every pull request that changes the web app, a Claude agent writes Playwright tests for the change, runs them,
# commits them to the PR branch when they are trustworthy, and comments with the results and suggested fixes.
# Needs the ANTHROPIC_API_KEY repository secret. Add the label "agent-retest" to a PR to run it again.
# See agents/testing_agent.py for the guardrails.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write        # commit the agent's tests to the PR branch
  pull-requests: write   # comment on the PR
  actions: write         # start the Tests workflow on the agent's commit

concurrency:
  group: testing-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  agent:
    name: Write and run tests for this PR
    # PRs from forks get no secrets, so the agent only runs for branches in this repository.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent-retest')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt
      - run: pip install -r requirements-agent.txt
      - run: python -m playwright install --with-deps chromium

      - name: Run the testing agent
        id: agent
        run: python -m agents.testing_agent --base "origin/${{ github.base_ref }}" --pr "$PR" --title "$TITLE" --out test-results/agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}

      - name: Commit the agent's tests to this PR
        if: steps.agent.outputs.commit == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/agent
          if git diff --cached --quiet; then
            echo "The agent's tests are unchanged."
            exit 0
          fi
          git commit -m "Testing agent: browser tests for PR #$PR"
          if git push origin "HEAD:$BRANCH"; then
            printf '\nCommitted the tests to this branch in %s. They now run with the rest of the browser tests.\n' "$(git rev-parse --short HEAD)" >> test-results/agent/comment.md
            # Pushes made with the workflow token don't start other workflows, so start the Tests workflow by hand.
            gh workflow run tests.yml --ref "$BRANCH"
          else
            printf '\nCould not commit the tests (the branch moved while the agent ran). They are in the workflow artifact.\n' >> test-results/agent/comment.md
          fi

      - name: Comment on the PR
        if: always() && hashFiles('test-results/agent/comment.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file test-results/agent/comment.md --edit-last --create-if-none

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testing-agent-results
          path: |
            test-results/agent/
            tests/e2e/agent/
          if-no-files-found: ignore
